[workspace]
resolver = "2"
members = ["crates/relay", "crates/relay-hub", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
loom-relay = { path = "crates/relay" }
loom-relay-hub = { path = "crates/relay-hub" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
bytes = "1.6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
