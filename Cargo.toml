[workspace]
resolver = "2"
members = ["crates/contract", "crates/worker", "crates/domain", "crates/loom", "crates/provider-protocol", "crates/relay", "crates/relay-hub", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88 is the floor the ACP SDK requires (`agent-client-protocol` 2.0.0 and
# `agent-client-protocol-schema` 1.5.0 both declare it, and their manifests use
# edition 2024, which Cargo cannot even parse before 1.85). Since loom's whole
# provider strategy is ACP, this floor is the protocol's floor.
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
loom-domain = { path = "crates/domain" }
loom-contract = { path = "crates/contract" }
loom-provider-protocol = { path = "crates/provider-protocol" }
loom-worker = { path = "crates/worker" }
loom-relay = { path = "crates/relay" }
loom-relay-hub = { path = "crates/relay-hub" }
loom-server = { path = "crates/server" }
# Pinned to the exact version the ACP SDK requires, so there is a single schema
# copy in the tree: type identity matters between a direct dependency and the
# one `agent-client-protocol` re-exports.
# Both pinned exactly, and together: the SDK requires a specific schema, and
# `pi-acp` (which loom embeds) pins schema `=1.5.0` too. One schema copy in the
# tree matters because type identity is what lets loom hand a `Channel` to
# `pi_acp::AcpAgent::run_with`.
agent-client-protocol = { version = "=2.0.0", default-features = false, features = ["unstable_protocol_v2"] }
# `pi-acp` is not published to crates.io, so it comes from git. It is pinned to
# a release tag rather than the upstream default branch: `v0.5.0` was the first
# release that carries everything loom needs — `run_with` (the transport
# injection this crate hands a `Channel` to) and native ACP v2. `v0.5.1` added
# the bash-call naming fix: a call opened by the streamed `toolcall_start` is now
# named by every following frame, so the command replaces the placeholder
# `"bash"` instead of never being sent. `v0.5.2` makes the adapter's settle
# fallback bound *silence* rather than the turn, so a long command or a long
# streamed answer is no longer failed while it is still working.
#
# That release also **removed the `protocol-v2` cargo feature** this manifest
# used to enable. pi-acp now always compiles both protocol implementations and
# negotiates one per connection in `initialize`, so there is no feature left to
# select; asking for it is a compile error, not a silent no-op.
#
# `Cargo.lock` still records the exact commit, so moving the pin stays an
# explicit `cargo update -p pi-acp`, never a silent one.
pi-acp = { git = "https://github.com/AndPuQing/pi-acp", tag = "v0.5.2" }
agent-client-protocol-schema = { version = "=1.5.0", default-features = false, features = ["unstable_protocol_v2"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "multipart"] }
base64 = "0.22"
# The command line, for all three entry points (`loom`, `loom server`, `loom
# worker`). Configuration is flags first: the roles read no `LOOM_*` variable
# except the one secret whose env fallback is deliberate (`--join-code`), so
# `--help` is the surface and a unit's ExecStart is the one place a deployment
# is written down.
clap = { version = "4.6", features = ["derive", "env"] }
# Scheduling: `croner` parses and evaluates the cron expression, `chrono-tz`
# supplies the timezone database it reads the expression in. The database is
# compiled into the binary, which is what lets the `FROM scratch` server image
# schedule in a named zone at all.
chrono = "0.4"
chrono-tz = "0.10"
croner = "4.0"
bytes = "1.6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
# The server's one persistent store, and the engine is SQLite itself, through
# its oldest and most used Rust binding. SQLite's own file is written with WAL;
# loom's logical rules — an append-only per-thread sequence, a revision that
# only moves forward — are the server's, not the database's.
#
# Every caller of the store is synchronous (an HTTP read, the writer thread, a
# test), and SQLite's API is too, so nothing sits between them and the file.
# `bundled` compiles SQLite from source into the binary, which is what keeps the
# `FROM scratch` image free of a runtime library; `default-features = false`
# leaves out the browser bindings this workspace never builds, and `cache` keeps
# one prepared-statement cache per connection.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
# A v1 ACP agent hands over a file's old and new text rather than a patch, and
# the timeline draws a patch: `similar` is the diff, so loom does not carry a
# second, hand-rolled implementation of one.
similar = "2"
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# Pinned to the line axum's `ws` feature already uses. A second, newer
# tungstenite pulls `sha1 0.11 -> digest 0.11 -> block-buffer 0.12`, whose
# manifest needs the `edition2024` cargo feature. That used to be the reason
# this was pinned (the workspace floor was 1.80, which cannot parse such a
# manifest); the floor is now 1.88, so the pin is about keeping one tungstenite
# in the tree and dropping duplicate sha1/rand versions rather than about the
# toolchain.
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
