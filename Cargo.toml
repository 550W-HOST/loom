[workspace]
resolver = "2"
members = ["crates/relay", "crates/relay-hub"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
bb-relay = { path = "crates/relay" }
bb-relay-hub = { path = "crates/relay-hub" }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
