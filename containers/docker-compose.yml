# loom on one machine, as containers: the control plane and one execution
# worker, each image running the one `loom` binary in its own role. This file is
# for a host that has docker and no reason to install the binary into the host's
# filesystem.
#
#   mkdir -p workspace && sudo chown 1000:1000 workspace
#   docker compose -f containers/docker-compose.yml up -d
#   curl -s http://127.0.0.1:38886/health
#
# The images come from the release; to use ones built from a checkout instead,
# see docs/containers.md § Building an image. Nothing here is loom-specific
# beyond the two images and their data directories — the server starts no
# worker, and the worker does not depend on the server's process.
name: loom

services:
  server:
    image: ghcr.io/550w-host/loom-server:${LOOM_IMAGE_TAG:-latest}
    # The container analog of the unit's `Restart=on-failure`.
    restart: unless-stopped
    ports:
      # Loopback on the host side, and that is the point: the API has no
      # authentication and can drive command execution on every enrolled
      # machine, so publishing it on every host interface is the one change
      # that opens everything docs/remote-access.md describes. Reaching it from
      # another machine means a tailnet or a reverse proxy in front of it, not
      # a different bind address here. LOOM_PORT moves the host side when 38886
      # is taken.
      - "127.0.0.1:${LOOM_PORT:-38886}:38886"
    volumes:
      # The relay log and the domain snapshot: what makes a rebuilt container
      # replay the retained window instead of starting an empty one.
      - server-data:/var/lib/loom/server
    command:
      # Inside the container this is the container's own interface — the port
      # would be unreachable from outside the namespace otherwise. The image
      # already defaults to it; it is spelled out here because it is the value
      # an operator changes (to 127.0.0.1:38886 when running with
      # `network_mode: host`, where 0.0.0.0 would mean the host's interfaces).
      - "--bind"
      - "0.0.0.0:38886"
      # The durable relay log, matching the volume below.
      - "--data-dir"
      - "/var/lib/loom/server"
      # This node's identity, stamped on every envelope it produces.
      - "--node-id"
      - "loom-server"

  worker:
    image: ghcr.io/550w-host/loom-worker:${LOOM_IMAGE_TAG:-latest}
    # The worker exits when it loses the server and has no internal reconnect,
    # so this is what the unit's `Restart=always` turns into. It is also what
    # makes `depends_on` below sufficient: an attempt that lands before the
    # server is listening fails and is retried by this policy. And it is what
    # starts a worker's self-updated binary after the update exits 0
    # (docs/upgrades.md § Worker self-update).
    restart: unless-stopped
    depends_on:
      - server
    command:
      # The server's service name on this network, not a URL a browser would
      # open. Plain http:// because the binary carries no TLS client: a
      # containerised worker reaches the server over a network that is itself
      # trusted (this compose network, a tailnet, a VPN), and TLS is terminated
      # for the browsers by something in front (docs/remote-access.md).
      - "--server-url"
      - "http://server:38886"
      # What the UI shows in the host list. Keep it stable and human-readable.
      - "--name"
      - "${LOOM_HOST_NAME:-loom-worker}"
      # The image's own defaults, repeated because `command:` replaces its CMD:
      # the enrolled host id that makes a rebuilt container the same machine,
      # and the mount point that is the whole of what this container can edit.
      - "--state"
      - "/var/lib/loom/host-id"
      - "--workspace-root"
      - "/workspace"
      # How to run a dispatched provider, when the default is not it. A `pi`
      # inside this image needs a derived image (docs/containers.md § Providers).
      # - "--provider-cmd"
      # - "/usr/local/bin/pi"
      #
      # Self-update is on by default, and this image could do it: it is the
      # `scratch`-free side of the pair, so a replaced file has somewhere to
      # land. What it needs is a server that hosts one — the server image runs
      # the same `loom` file, and serves that running binary as the worker
      # artifact itself, so no `loom-worker` name is required beside it. A
      # `--artifact-dir` holding `loom-worker-<triple>` files is only needed to
      # serve another architecture. Without one, leave this off and rebuild the
      # image, which is the same "replace the file, restart the process" with
      # the container runtime as the supervisor (docs/upgrades.md).
      # - "--no-auto-update"
    volumes:
      # The host identity, the replay cursor and the provider's own
      # configuration ($HOME/.pi and friends). All three have to survive a
      # rebuild or the machine changes identity, replays from the beginning, or
      # asks a provider to log in again.
      - worker-state:/var/lib/loom
      # The only part of the host this worker can edit. A bind mount, because
      # the whole point of an execution machine is that its work lands
      # somewhere its owner can see — and because everything outside these two
      # mounts is the container's own filesystem, which is what
      # docs/containers.md § What a containerised worker cannot do is about.
      - ${LOOM_WORKSPACE:-./workspace}:/workspace
      # A provider configuration that already exists on the host, instead of
      # logging in inside the volume:
      # - ${HOME}/.pi:/var/lib/loom/.pi:ro

volumes:
  server-data:
  worker-state:
