[package]
name = "loom-server"
description = "loom control plane: HTTP API and WebSocket surface on top of the relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
loom-contract.workspace = true
loom-domain.workspace = true
loom-provider-protocol.workspace = true
loom-relay.workspace = true
loom-relay-hub.workspace = true
axum = { workspace = true }
bytes.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The artifact host hashes the worker binary it serves, and the client side of
# the same module verifies the download. `sha2` is the one addition, and it is
# what turns "the download completed" into "the download is the file the server
# published". It is pure Rust with no C dependency, so it does not disturb the
# static musl build.
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util", "process", "signal"] }

[dev-dependencies]
# The automation tests assert that a schedule is read in its zone — `nextRunAt`
# is 09:00 in Paris, not 09:00 UTC — so they read the instant back the way a
# client would.
chrono.workspace = true
chrono-tz.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite.workspace = true
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
