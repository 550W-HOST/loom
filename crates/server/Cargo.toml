[package]
name = "loom-server"
description = "loom control plane: HTTP API and WebSocket surface on top of the relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
loom-domain.workspace = true
loom-provider-protocol.workspace = true
loom-relay.workspace = true
loom-relay-hub.workspace = true
axum = { workspace = true }
bytes.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "signal"] }

[dev-dependencies]
loom-contract.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite.workspace = true
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
