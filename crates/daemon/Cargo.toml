[package]
name = "loom-daemon"
description = "loom host daemon: the execution-plane process, started and stopped independently of the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
loom-domain.workspace = true
loom-provider-protocol.workspace = true
loom-relay.workspace = true
loom-server.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
axum.workspace = true
loom-contract.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
