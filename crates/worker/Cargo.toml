[package]
name = "loom-worker"
description = "loom worker: the execution-plane process, started and stopped independently of the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
loom-domain.workspace = true
# The ACP protocol types, so the adapter translates against the real schema
# rather than a hand-copied mirror of it (which would drift silently).
agent-client-protocol.workspace = true
pi-acp.workspace = true
agent-client-protocol-schema.workspace = true
loom-provider-protocol.workspace = true
loom-relay.workspace = true
loom-server.workspace = true
base64.workspace = true
clap.workspace = true
hostname.workspace = true
futures-util.workspace = true
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite.workspace = true
portable-pty = "0.9.0"
sha2 = "0.10"

[dev-dependencies]
axum.workspace = true
loom-contract.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
