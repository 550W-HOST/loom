name: Release

# Validation and publication are deliberately split across two workflows. CI
# (ci.yml) runs on every push and pull request and ships nothing; this one runs
# on a `v*` tag and publishes, and the only thing it re-checks is what a release
# has to prove for itself — that the product app builds the bundle the server
# compiles in, that the artifacts run, and that the archive is what it claims to
# be.
#
# The manual trigger is the rehearsal: it runs the identical pipeline and stops
# before the release job, so a pre-release can be built and verified from a
# branch, or from a tag that is not ready to publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at the top, `contents: write` granted only to the job that
# creates the release.
permissions:
  contents: read

# A newer run does not cancel an older one: a half-published release page is
# worse than a queued run. Each tag gets its own group anyway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job that compiles a binary needs the built product app, and this one is
  # where it comes from: `crates/server/build.rs` compiles `apps/app/dist` into
  # the server, so the bundle is a **compile-time input** — `cargo build` fails
  # without it — and not a file that ships beside the binary. It is built once
  # here and handed to both target jobs as an artifact, so one bundle is compiled
  # into both architectures. The typecheck and test steps are the app's own gates,
  # and the only place this workflow runs them: a bundle that does not typecheck
  # or pass its tests must fail the release rather than be compiled into it.
  # ci.yml keeps checking the committed `apps/app` snapshot on every push
  # (docs/ci.md).
  ui:
    name: UI bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: pnpm run typecheck
        run: pnpm run typecheck

      - name: pnpm run test
        run: pnpm run test

      - name: Build the product app
        run: pnpm --filter @bb/app run build

      - name: The bundle must be self-contained
        run: |
          set -euo pipefail
          # The shape `crates/server/build.rs` compiles into the binary: an entry
          # document plus the hashed assets it references. An index.html without
          # its assets is a document that answers 200 and paints nothing, which is
          # what this catches before it is embedded in a release binary.
          test -f apps/app/dist/index.html
          grep -q 'src="/assets/[^"]*\.js"' apps/app/dist/index.html
          ls apps/app/dist/assets/*.js >/dev/null
          ls apps/app/dist/assets/*.css >/dev/null

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: apps/app/dist/
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: ui
    strategy:
      # Both targets are wanted even if one fails: the failing log is the point
      # of the run, and a partial release page is never published because the
      # jobs after this one need all of them.
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bundle the `ui` job built, at the path a checkout builds it to. The
      # `cargo build` below needs it there: `crates/server/build.rs` compiles it
      # into the server and fails outright when the directory is absent. It is
      # platform-independent, so both matrix entries download the same one.
      - name: Download the UI bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: apps/app/dist

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      # No linker is installed for the cross target beyond this line: the
      # aarch64 build links with the `rust-lld` the toolchain already ships, and
      # `.cargo/config.toml` is where that is wired up. Neither `cargo-zigbuild`
      # nor a `cross` container is involved.
      - name: rustup target add ${{ matrix.target }}
        run: rustup target add "${{ matrix.target }}"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Per target: a `target` directory holds one triple's artifacts, and a
          # shared key would restore the wrong one.
          prefix-key: release-${{ matrix.target }}

      - name: cargo build --release --locked --target ${{ matrix.target }}
        run: cargo build --release --locked --target "${{ matrix.target }}"

      # The x86_64 artifact is started, `/health` answered, the app it serves out
      # of the binary checked (entry document, its asset, a client route fallen
      # back to it, an unknown API path answered as a JSON 404), a `LOOM_UI_DIR`
      # refused, a project created and a daemon enrolled against it. `GITHUB_SHA`
      # is the commit the build stamped, so a mismatch fails here.
      - name: Verify the x86_64 binaries end to end
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          scripts/verify-release-binaries.sh "target/${{ matrix.target }}/release" \
            --expect-commit "$GITHUB_SHA" --expect-target "${{ matrix.target }}"

      # The same script without execution: an aarch64 binary needs an arm64
      # machine or a qemu binfmt registration this runner does not have, and
      # adding an emulator would put a second, slower implementation into the
      # release path. Everything a foreign machine can still check is checked —
      # the ELF machine, the absence of a loader and of shared libraries, and
      # the commit the build stamped into the file.
      - name: Verify the aarch64 binaries are self-contained aarch64 artifacts
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          scripts/verify-release-binaries.sh "target/${{ matrix.target }}/release" \
            --elf-only --expect-commit "$GITHUB_SHA" --expect-target "${{ matrix.target }}"

      - name: Package this target
        run: scripts/package-release.sh "${{ matrix.target }}"

      - name: Upload this target's artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # One release page, so one job that holds every target's files: `SHA256SUMS`
  # has to cover both, and the notes have to describe the set rather than one
  # member of it.
  assemble:
    name: SHA256SUMS and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    outputs:
      # What the images job tags its pushes with. It comes from the artifact
      # rather than from the tag name so that the version in an image reference,
      # the version in the release notes and the version inside the binary are
      # one reading of the same file.
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Download every target's artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The checksum file lists relative names, so `sha256sum -c SHA256SUMS`
      # works in whatever directory a downloader unpacked it into.
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # `--` first: a file name is not an option, and the glob is left to
          # expand rather than listed by hand so an asset added above is
          # covered without touching this line. Every file the release page
          # offers is named here, which is what makes `sha256sum -c SHA256SUMS`
          # a check a downloader can run over the whole download.
          sha256sum -- loom-server-* loom-daemon-* *.tar.gz >SHA256SUMS
          sha256sum -c SHA256SUMS

      # The x86_64 binary is the only artifact this runner can execute, and it
      # is where the version, the protocol version and the commit in the notes
      # come from — the published artifact's own claim rather than a second
      # reading of the source.
      - name: Read the version the artifacts report
        id: release
        run: |
          set -euo pipefail
          # The executable bit does not survive an artifact round trip, hence
          # the chmod before asking the binary anything.
          chmod +x dist/loom-server-x86_64-unknown-linux-musl
          server_line="$(dist/loom-server-x86_64-unknown-linux-musl --version)"
          echo "$server_line"
          version="$(awk '{print $2}' <<<"$server_line")"
          protocol="$(sed -nE 's/.*protocol ([0-9]+).*/\1/p' <<<"$server_line")"
          commit="$(sed -nE 's/.*commit ([0-9a-f]+).*/\1/p' <<<"$server_line")"
          [[ -n "$version" && -n "$protocol" && -n "$commit" ]]

          # A tag that disagrees with the version inside the binary is a release
          # page whose name lies about its contents. `-rc` and friends are
          # allowed to hang off the version, but nothing else is.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            case "$GITHUB_REF_NAME" in
              "v$version" | "v$version"-*) ;;
              *)
                echo "tag $GITHUB_REF_NAME does not match the built version v$version" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "version=$version"
            echo "protocol=$protocol"
            echo "commit=$commit"
          } >>"$GITHUB_OUTPUT"

      - name: Release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PROTOCOL: ${{ steps.release.outputs.protocol }}
          COMMIT: ${{ steps.release.outputs.commit }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # A quoted heredoc, so nothing in the notes is expanded while it is
          # written and the placeholders are the only thing substituted.
          cat >dist/RELEASE_NOTES.md <<'NOTES'
          # loom __VERSION__

          Static musl binaries for Linux, x86_64 and aarch64. Both are
          self-contained: no glibc, no dynamic loader to find, no shared library
          to install.

          **Protocol version: __PROTOCOL__.** A server and a daemon connect only
          when their protocol versions are equal, so upgrade them together.
          Both binaries are version __VERSION__, and the commit they were built
          from is `__COMMIT__`.

          ## Downloads

          | Asset | What it is |
          | --- | --- |
          | `loom-__VERSION__-x86_64-unknown-linux-musl.tar.gz` | server and daemon for x86_64, with `deploy/` |
          | `loom-__VERSION__-aarch64-unknown-linux-musl.tar.gz` | server and daemon for aarch64, with `deploy/` |
          | `loom-server-<target>` | the control plane alone |
          | `loom-daemon-<target>` | the execution daemon alone |
          | `SHA256SUMS` | checksums for every file above |

          ## Container images

          The same two binaries, built from these files and published to GitHub
          Container Registry for `linux/amd64` and `linux/arm64`, running as
          uid/gid 1000:1000:

          ```
          docker pull __REGISTRY__/loom-server:__VERSION__
          docker pull __REGISTRY__/loom-daemon:__VERSION__
          ```

          `docs/containers.md` covers the volumes, the port, and the honest
          limits of a containerised daemon.

          ## Install

          ```
          tar xzf loom-__VERSION__-<target>.tar.gz
          cd loom-__VERSION__-<target>
          sudo LOOM_BIN_SOURCE=. ./deploy/install.sh server
          sudo LOOM_BIN_SOURCE=. ./deploy/install.sh daemon <server-key> <server-url>
          ```

          `LOOM_BIN_SOURCE=.` is the extracted directory itself: the archive
          holds the two binaries unnamed at its top level for exactly that. There
          is nothing else to install — the server carries the product app
          compiled into it, so it serves its own client. `deploy/README.md` has
          the rest.

          ## Verify before you install

          ```
          sha256sum -c SHA256SUMS
          ./loom-server --version
          ```

          The second line prints the version, the target triple, the protocol
          version and the commit the file was built from.

          ## What was verified before publishing

          * the x86_64 pair was started with no UI configuration at all: the app
            it serves out of the binary answered on `/` with its entry document,
            that document's script was served, a client route fell back to the
            document, an unknown `/api` path was a JSON 404, a `LOOM_UI_DIR` in
            the environment was refused, a project was created and read back, and
            a daemon enrolled against it (`scripts/verify-release-binaries.sh`)
          * the product app was built from source here and compiled into both
            binaries (`crates/server/build.rs`), so the client an installing
            operator gets is the one this run typechecked, tested and built —
            `cargo build` fails rather than shipping a server without it
          * both pairs were checked as self-contained artifacts: 64-bit ELF of
            the target machine, no interpreter, no `NEEDED` shared library, and
            the commit above stamped into the file
          * both container images were built from the checksummed files above,
            pushed, and the x86_64 pair was pulled back and started: `--version`
            matched the version in this page, and the server image served the
            app compiled into its binary
          NOTES
          # `|` as the delimiter for the registry: a repository path contains
          # slashes. `${REGISTRY,,}` is the lowercase form GHCR requires.
          sed -i \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__PROTOCOL__/$PROTOCOL/g" \
            -e "s/__COMMIT__/$COMMIT/g" \
            -e "s|__REGISTRY__|${REGISTRY,,}|g" \
            dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Upload the release page contents
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # Both images are built from `release-dist` — the checksummed set the release
  # job publishes, not a second build of the same commit — so the binary inside
  # a `docker pull` is the binary `sha256sum -c SHA256SUMS` accepted, and the app
  # it serves is the one compiled into that binary. One multi-platform invocation
  # per image is enough because neither Dockerfile has a `RUN`: nothing executes
  # while building, which is what keeps an emulator out of this pipeline the same
  # way it is kept out of the cargo builds (docs/releasing.md § Targets,
  # docs/containers.md).
  images:
    name: container images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: assemble
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release page contents
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-dist
          path: dist

      # The builder that ships as the default is the `docker` driver, and it
      # refuses a multi-platform build outright. A container driver is what
      # produces a manifest list; `--use` is what makes the script's plain
      # `docker buildx build` reach it.
      - name: Set up BuildKit
        run: docker buildx create --name loom --driver docker-container --bootstrap --use

      # A tag pushes; a manual run builds and loads into the runner's own daemon
      # instead, so the rehearsal exercises both Dockerfiles without publishing
      # anything. The `--platform` default is the local daemon's architecture,
      # which is why the rehearsal is one platform and a release is two.
      - name: Build the images, and push them on a tag
        id: images
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          # GHCR wants a lowercase repository path and an owner name may have
          # capitals; the images job and the release notes have to agree on it.
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          args=(--registry "$registry")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            platforms=linux/amd64,linux/arm64
            # The version, the tag it was cut from, and `latest` for anything
            # that is not a pre-release — the same `-` rule the release page's
            # own flag uses.
            tags="$VERSION,v$VERSION"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *) tags="$tags,latest" ;;
            esac
            tag="$VERSION"
            # The only difference from the rehearsal branch: without it the
            # script loads the images into the runner's daemon instead of
            # publishing them.
            args+=(--push)
          else
            platforms=linux/amd64
            tags=rehearsal
            tag=rehearsal
          fi
          {
            echo "registry=$registry"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"
          scripts/build-container-images.sh "${args[@]}" \
            --tags "$tags" --platform "$platforms"

      # This runner executes linux/amd64 only, so the amd64 half of each manifest
      # list is pulled back (or taken from what was loaded) and asked what it is:
      # a push that carried somebody else's bytes, or an image built from the
      # wrong architecture's binary, fails here rather than in a user's terminal.
      # The server image is asked a second question — whether it serves the app —
      # because `--version` alone cannot tell a server built with the app
      # compiled in from one built against a stale `apps/app/dist`: a missing
      # directory is a build failure, the wrong one is not, and both report the
      # same version. The aarch64 half is a foreign-platform build of the same
      # files and is not executed anywhere in this pipeline, by the same
      # reasoning as `verify-release-binaries.sh --elf-only`.
      - name: Run what was pushed
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
          REGISTRY: ${{ steps.images.outputs.registry }}
          TAG: ${{ steps.images.outputs.tag }}
        run: |
          set -euo pipefail
          for image in loom-server loom-daemon; do
            line="$(docker run --rm "$REGISTRY/$image:$TAG" --version)"
            echo "$line"
            reported="$(awk '{print $2}' <<<"$line")"
            [[ "$reported" == "$VERSION" ]] || {
              echo "$image reports version $reported, not $VERSION" >&2
              exit 1
            }
          done

          # The image carries a server with the app compiled in. Asked by running
          # it: a random host port, the app's entry document, and the asset that
          # document names — the part a server without the app in it cannot
          # answer, since there is no bundle to fall back to and no variable to
          # point at one.
          docker run --detach --name ui-check --publish 127.0.0.1::38886 \
            "$REGISTRY/loom-server:$TAG" >/dev/null
          # Removed on every path, a failed assertion included: the name has to
          # be free the next time this job runs.
          trap 'docker rm --force ui-check >/dev/null 2>&1 || true' EXIT
          base="http://$(docker port ui-check 38886 | head -n 1)"
          for _ in $(seq 1 100); do
            curl -fsS --max-time 1 "$base/health" >/dev/null 2>&1 && break
            sleep 0.2
          done
          index="$(curl -fsS --max-time 5 "$base/")" || {
            echo "the server image answered no index document on /" >&2
            exit 1
          }
          entry="$(sed -n 's/.*<script[^>]*src="\(\/assets\/[^"]*\.js\)".*/\1/p' <<<"$index" | head -n 1)"
          [[ -n "$entry" ]] || {
            echo "GET / named no /assets/*.js entry point: the image's server was built without the app embedded" >&2
            exit 1
          }
          curl -fsS --max-time 5 -o /dev/null "$base$entry" || {
            echo "GET $entry failed: the app embedded in the image is incomplete" >&2
            exit 1
          }
          echo "the server image serves $entry out of its own binary"

  # The rehearsal path stops here: everything above ran, nothing was published.
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [assemble, images]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download the release page contents
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-dist
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          # The round trip through the artifact store is checked, not assumed:
          # these are the bytes that are about to be published.
          sha256sum -c SHA256SUMS

          assets=(loom-server-* loom-daemon-* *.tar.gz SHA256SUMS)
          # A tag with a suffix is a pre-release by its own naming, which is how
          # `v0.2.0-rc.1` is published without becoming "the latest release".
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-running a failed release refreshes it instead of failing on
            # assets that are already there.
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              --prerelease="$prerelease"
          fi
          gh release view "$GITHUB_REF_NAME" --json url,assets --jq '.url, (.assets[].name)'
