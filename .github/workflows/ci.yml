name: CI

# Validation only. Push and pull request are the trigger set on purpose: no
# release, image build or deploy step belongs in this file.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `include_bytes!` embeds the UI bundle into loom-server, so this job
    # compiles the UI whether or not the pull request touched it. Waiting for
    # `ui` means a bundle that drifted from `ui/src` fails there rather than
    # compiling into a Rust build that looks green.
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain is read from rust-toolchain.toml, so CI and a developer's
      # machine run the same rustc, cargo, rustfmt and clippy with no second
      # version to keep in step.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # No LOOM_REDIS_URL is set, so the Redis-backed relay cases skip through
      # the existing mechanism; the in-process and disk backends still run.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # The coverage document claims which contract routes loom implements, and
  # — since W-554 — that an implemented JSON-body route has a request-side
  # conformance assertion. That claim is a script, not a review habit: run it
  # rather than trusting a reader to notice a stale row.
  api-coverage:
    name: API coverage document is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Re-reads the contract and the source routes, refuses a stale row, and
      # fails when an implemented JSON-body route has no `validate_request*`
      # assertion. Never `--write`: this job must not edit the tree it checks.
      - name: node scripts/check-api-coverage.mjs
        run: node scripts/check-api-coverage.mjs

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same reason as `checks`: `cargo check --workspace` compiles loom-server,
    # and with it whichever revision of `ui/app.js` is in the tree.
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read the floor out of the manifests instead of copying it here, so
      # `rust-version` cannot drift away from the toolchain CI actually
      # compiles with. Every crate inherits it, hence the single-value check.
      - name: Read rust-version from the workspace
        id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '[.packages[].rust_version]
                     | unique
                     | if length == 1 then .[0]
                       else error("crates disagree on rust-version: \(.)")
                       end')"
          echo "workspace rust-version is $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: msrv

      # `check` and not `build`: the claim being tested is that the declared
      # floor can type-check the workspace, which is what catches a call into a
      # newer std (`Option::is_none_or` needs 1.82) or a dependency that
      # quietly raised its own floor. `+` pins the toolchain explicitly so the
      # repo's rust-toolchain.toml channel cannot win.
      - name: cargo check --workspace --all-targets
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  contract:
    name: bb contract is reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: this job decides whether the committed artifacts are
          # reproducible, so its own tool is not left floating.
          bun-version: 1.4.2

      # Regenerate from the revision the manifest records, never from bb's main,
      # so this job fails on exporter drift rather than on unrelated progress in
      # a repository we do not track. Both the URL and the commit come from the
      # manifest, so the pin lives in exactly one place.
      - name: Fetch the bb revision recorded in the manifest
        run: |
          set -euo pipefail
          repository="$(jq -r .source.repository contracts/bb/manifest.json)"
          commit="$(jq -r .source.commit contracts/bb/manifest.json)"
          echo "exporting from $repository at $commit"
          bb_src="$RUNNER_TEMP/bb"
          git init --quiet "$bb_src"
          git -C "$bb_src" remote add origin "$repository"
          git -C "$bb_src" fetch --quiet --depth 1 origin "$commit"
          git -C "$bb_src" checkout --quiet FETCH_HEAD

      - name: Regenerate the contract
        run: BB_SRC="$RUNNER_TEMP/bb" scripts/export-bb-contract.sh

      # Modifications, additions and removals all have to fail the run: the
      # artifacts are generated, so any difference means the export is stale.
      - name: The committed artifacts must match
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/bb
          test -z "$(git status --porcelain -- contracts/bb)"

  # The UI is a pnpm workspace of nine projects (`ui/`, its seven projection
  # packages and the workspace root) whose tests and type checks nothing else
  # runs. It also produces `ui/app.js`, a generated bundle that is committed on
  # purpose: the server embeds it with `include_bytes!`
  # (crates/server/src/ui.rs), so the Rust build compiles whichever revision is
  # in the tree. A bundle that drifted from `ui/src` therefore ships a server
  # that is wrong only in a browser, which is the failure this job exists to
  # catch.
  ui:
    name: UI typecheck, tests and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input on purpose: the action reads `packageManager` from
      # package.json, so pnpm is pinned in one place and cannot disagree with
      # pnpm-lock.yaml — the same shape as the bb revision, which this workflow
      # reads from the manifest rather than repeating in two places.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node only has to run `tsc`, `vitest` and esbuild, whose behaviour is
      # fixed by the lockfile, so the major line is enough. The cache is the
      # pnpm store, keyed on pnpm-lock.yaml.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # The root scripts fan out over `@loom/ui` and every `ui/packages/*`
      # through pnpm's own workspace filter, so a package added to the workspace
      # is covered without editing this file.
      - name: pnpm typecheck
        run: pnpm run typecheck

      - name: pnpm test
        run: pnpm run test

      # The same command the root `build` script runs first, and the one
      # docs/ci.md gives as the local equivalent; the packages' own `build` is
      # another `tsc --noEmit`, which the typecheck step above already ran. It
      # is not interchangeable with `node ui/scripts/build.mjs` from the
      # repository root: esbuild writes its module path comments relative to the
      # working directory, so the committed bytes only reproduce from inside
      # `ui/`.
      - name: Rebuild the committed bundle
        run: pnpm --filter @loom/ui run build

      # Modifications, additions and removals all have to fail: the bundle is
      # generated, so any difference means the committed one is stale. Both
      # halves are needed, exactly as in the `contract` job — `git diff` catches
      # tracked files and `git status` catches one the build added or removed.
      # The build's own output under `ui/dist/` is gitignored.
      - name: The committed bundle must match
        run: |
          set -euo pipefail
          git diff --exit-code -- ui/
          test -z "$(git status --porcelain -- ui/)"

  # `the_real_pi_process_streams_through_the_bridge` is `#[ignore]`d because it
  # runs the actual `pi` CLI. It is the only automated coverage of the bridge
  # the daemon really uses, so it runs here rather than staying manual — but on
  # its own job, allowed to fail, because `pi` is an upstream package and a
  # release of it is not a reason to block a merge into this repository.
  #
  # It needs `ui` for the same reason as `checks`: the daemon depends on
  # loom-server, so this job embeds the bundle too.
  pi:
    name: real pi provider (allowed to fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: pi

      - name: Install the pi CLI
        run: npm install -g @earendil-works/pi-coding-agent@0.85.1

      # A configured `pi`, not merely an installed one, is the prerequisite. On
      # a stock runner `$HOME/.pi/agent` does not exist, and `pi --mode rpc`
      # then exits without emitting a single frame, so the test fails in under a
      # second every time — a permanently red job that carries no information.
      # Probe the behaviour the test actually needs and skip loudly instead.
      - name: Is pi configured on this runner?
        id: pi
        run: |
          set -uo pipefail
          # `</dev/null` makes pi exit on EOF, so this returns in a few seconds.
          # No `pipefail` masking: the output is captured whole, not piped.
          frames="$(timeout 30 pi --mode rpc --no-session </dev/null 2>/dev/null || true)"
          if [ -n "$frames" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=real pi test skipped::pi is installed but not configured on this runner (no \$HOME/.pi/agent), so it emits no RPC frames. Configure pi to enable this job; see docs/ci.md."
          fi

      - name: cargo test -p loom-daemon --test provider_e2e -- --ignored
        if: steps.pi.outputs.configured == 'true'
        run: cargo test -p loom-daemon --test provider_e2e --locked -- --ignored

  # The daemon's self-update, end to end: a real daemon process, a fake server
  # that speaks a newer protocol, a real install over the running executable,
  # and the reinstalled binary running a real turn. `#[ignore]`d because it
  # executes real binaries and binds real sockets; unlike the `pi` job it needs
  # nothing external — the artifact it serves is the binary this job just built
  # — so it is allowed to fail the build.
  #
  # It needs `ui` for the same reason as `checks`: the daemon depends on
  # loom-server, so this job embeds the bundle too.
  self-update:
    name: daemon self-update end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: self-update

      # `CARGO_BIN_EXE_loom-daemon` is what the test runs, so the binary has to
      # be built before the ignored test is invoked — `cargo test --test` builds
      # the test target but not necessarily the binary it points at.
      - name: cargo build -p loom-daemon -p loom-server
        run: cargo build -p loom-daemon -p loom-server --locked

      - name: cargo test -p loom-daemon --test self_update
        run: cargo test -p loom-daemon --test self_update --locked -- --ignored --test-threads=1
