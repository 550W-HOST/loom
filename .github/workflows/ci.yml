name: CI

# Validation only. Push and pull request are the trigger set on purpose: no
# release, image build or deploy step belongs in this file.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Rust crates embed the built app, so this job cannot compile until
    # the `ui` job has produced the bundle — and a client that fails its own
    # gates stops the pipeline there rather than twenty minutes into a Rust
    # build that could not ship.
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain is read from rust-toolchain.toml, so CI and a developer's
      # machine run the same rustc, cargo, rustfmt and clippy with no second
      # version to keep in step.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      # The app is compiled into these binaries: without the bundle the build
      # fails rather than shipping a server that cannot serve a client.
      - name: Download the app bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: apps/app/dist

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The relay's scenarios run over both backends it has: the in-process one
      # and the durable one, each in its own scratch directory.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # The coverage document claims which contract routes loom implements, and
  # — since W-554 — that an implemented JSON-body route has a request-side
  # conformance assertion. That claim is a script, not a review habit: run it
  # rather than trusting a reader to notice a stale row.
  api-coverage:
    name: API coverage document is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Re-reads the contract and the source routes, refuses a stale row, and
      # fails when an implemented JSON-body route has no `validate_request*`
      # assertion. Never `--write`: this job must not edit the tree it checks.
      - name: node scripts/check-api-coverage.mjs
        run: node scripts/check-api-coverage.mjs

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same reason as `checks`: the Rust crates compile against the workspace
    # state the `ui` job produces, so a broken bundle is caught there first.
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read the floor out of the manifests instead of copying it here, so
      # `rust-version` cannot drift away from the toolchain CI actually
      # compiles with. Every crate inherits it, hence the single-value check.
      - name: Read rust-version from the workspace
        id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '[.packages[].rust_version]
                     | unique
                     | if length == 1 then .[0]
                       else error("crates disagree on rust-version: \(.)")
                       end')"
          echo "workspace rust-version is $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal

      # The app is compiled into these binaries: without the bundle the build
      # fails rather than shipping a server that cannot serve a client.
      - name: Download the app bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: apps/app/dist

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: msrv

      # `check` and not `build`: the claim being tested is that the declared
      # floor can type-check the workspace, which is what catches a call into a
      # newer std (`Option::is_none_or` needs 1.82) or a dependency that
      # quietly raised its own floor. `+` pins the toolchain explicitly so the
      # repo's rust-toolchain.toml channel cannot win.
      - name: cargo check --workspace --all-targets
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  contract:
    name: bb contract is reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: this job decides whether the committed artifacts are
          # reproducible, so its own tool is not left floating.
          bun-version: 1.4.2

      # Regenerate from the revision the manifest records, never from bb's main,
      # so this job fails on exporter drift rather than on unrelated progress in
      # a repository we do not track. Both the URL and the commit come from the
      # manifest, so the pin lives in exactly one place.
      - name: Fetch the bb revision recorded in the manifest
        run: |
          set -euo pipefail
          repository="$(jq -r .source.repository contracts/bb/manifest.json)"
          commit="$(jq -r .source.commit contracts/bb/manifest.json)"
          echo "exporting from $repository at $commit"
          bb_src="$RUNNER_TEMP/bb"
          git init --quiet "$bb_src"
          git -C "$bb_src" remote add origin "$repository"
          git -C "$bb_src" fetch --quiet --depth 1 origin "$commit"
          git -C "$bb_src" checkout --quiet FETCH_HEAD

      - name: Regenerate the contract
        run: BB_SRC="$RUNNER_TEMP/bb" scripts/export-bb-contract.sh

      # Modifications, additions and removals all have to fail the run: the
      # artifacts are generated, so any difference means the export is stale.
      - name: The committed artifacts must match
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/bb
          test -z "$(git status --porcelain -- contracts/bb)"

  # The client is a pnpm workspace of the product app and the bb packages it
  # builds against (`apps/app` + `ui/packages/*`), whose tests and type checks
  # nothing else runs. The app is also **compiled into
  # the one binary** (`crates/server/build.rs` walks `apps/app/dist`), so this
  # job produces a compile-time input for every Rust job below: it builds the
  # bundle, checks it against the bundle budget, and uploads it. An over-budget
  # client otherwise ships a server that is wrong only in a browser.
  ui:
    name: UI typecheck, tests and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input on purpose: the action reads `packageManager` from
      # package.json, so pnpm is pinned in one place and cannot disagree with
      # pnpm-lock.yaml — the same shape as the bb revision, which this workflow
      # reads from the manifest rather than repeating in two places.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node only has to run `tsc`, `vitest` and esbuild, whose behaviour is
      # fixed by the lockfile, so the major line is enough. The cache is the
      # pnpm store, keyed on pnpm-lock.yaml.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # The root scripts fan out over every `ui/packages/*` and `apps/app`
      # through pnpm's own workspace filter, so a package added to the workspace
      # is covered without editing this file.
      - name: pnpm typecheck
        run: pnpm run typecheck

      - name: pnpm test
        run: pnpm run test

      # The same command the root `build` script runs last, and the one
      # docs/ci.md gives as the local equivalent. Its output is the bundle the
      # release archive stages as `ui/` and the container image carries.
      - name: Build the product app bundle
        run: pnpm --filter @bb/app run build

      # The build above writes bundle-stats.json, which this reads. The budget
      # is what keeps the client loadable on a slow link: a route that grows
      # past its allowance fails here rather than in a user's browser. It also
      # fails when the build did not precompress, because an unmeasured bundle
      # could hide growth behind the compressed budget.
      - name: Bundle budget
        run: pnpm --filter @bb/app run check:bundle

      # The Rust jobs compile these bytes into the server, so they need the
      # bundle in their own workspaces; passing it as an artifact keeps one
      # build authoritative instead of each job rebuilding the app.
      - name: Upload the app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: apps/app/dist/
          if-no-files-found: error

      # The build writes only ignored paths (`apps/app/dist`, `bundle-stats.json`);
      # a tracked file that changed here means the job mutated the checkout it
      # was supposed to read, which is the same guard the contract job applies
      # to `contracts/bb` after its export.
      - name: The committed UI and product app must match
        run: |
          set -euo pipefail
          git diff --exit-code -- ui/ apps/app/
          test -z "$(git status --porcelain -- ui/ apps/app/)"

  # The `ui` job builds and measures the client; nothing there can say whether
  # a browser can use it. This job runs the product the way a user meets it: the
  # binary serving the app it was built with, and a worker executing on the same
  # machine. It needs `ui` for the same reason `checks` does — the app is
  # compiled into the binary — and it is the only job that renders pixels.
  e2e:
    name: Browser acceptance
    runs-on: ubuntu-24.04
    needs: ui
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Download the app bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: apps/app/dist

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The suite starts this binary in both roles, so it is the only build
      # step: `loom server` serves the embedded app, `loom worker` executes.
      - name: Build the binary the suite drives
        run: cargo build -p loom --locked

      # Chromium only, with the system libraries it needs. The version is pinned
      # by the lockfile through @playwright/test.
      - name: Install Chromium
        run: pnpm --filter @loom/e2e exec playwright install --with-deps chromium

      - name: Typecheck the suite
        run: pnpm --filter @loom/e2e run typecheck

      - name: pnpm --filter @loom/e2e test
        run: pnpm --filter @loom/e2e test

      # A browser failure is only diagnosable with the trace and the screenshots
      # the run captured, so they outlive the job.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # `the_real_pi_process_streams_through_the_bridge` is `#[ignore]`d because it
  # runs the actual `pi` CLI through embedded `pi-acp`. It is the only automated
  # coverage of the real Pi adapter path, so it runs here rather than staying
  # manual — but on its own job, allowed to fail, because `pi` is an upstream
  # package and a release of it is not a reason to block a merge into this
  # repository.
  #
  # It builds the same UI as `checks` for the same reason: nothing in the Rust
  # build needs the bundle any more, but the workspace job's gates do.
  pi:
    name: real pi provider (allowed to fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # The app is compiled into these binaries: without the bundle the build
      # fails rather than shipping a server that cannot serve a client.
      - name: Download the app bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: apps/app/dist

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: pi

      - name: Install the pi CLI
        run: npm install -g @earendil-works/pi-coding-agent@0.85.1

      # A configured `pi`, not merely an installed one, is the prerequisite for
      # the embedded `pi-acp` integration. On a stock runner `$HOME/.pi/agent`
      # does not exist, and the internal Pi RPC child exits without emitting a
      # frame, so the test fails deterministically.
      - name: Is pi configured on this runner?
        id: pi
        run: |
          set -uo pipefail
          # Probe the Pi RPC child that embedded pi-acp starts. `</dev/null`
          # makes it exit on EOF, so this returns in a few seconds.
          frames="$(timeout 30 pi --mode rpc --no-session </dev/null 2>/dev/null || true)"
          if [ -n "$frames" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=real pi test skipped::pi is installed but not configured on this runner (no \$HOME/.pi/agent), so the embedded pi-acp path cannot start a Pi RPC child. Configure pi to enable this job; see docs/ci.md."
          fi

      - name: cargo test -p loom-worker --test provider_e2e -- --ignored
        if: steps.pi.outputs.configured == 'true'
        run: cargo test -p loom-worker --test provider_e2e --locked -- --ignored

      # The real Pi first-turn and cross-run resume, through the embedded
      # adapter. `provider_e2e`'s ignored test already drives the real CLI; this
      # one adds the property that test cannot: that `session/load` on a second
      # run continues the *same* conversation, which is what the thread's
      # provider-session binding exists for.
      - name: cargo test -p loom-worker --test real_pi -- --ignored
        if: steps.pi.outputs.configured == 'true'
        run: cargo test -p loom-worker --test real_pi --locked -- --ignored

  # The worker's self-update, end to end: a real worker process, a fake server
  # that speaks a newer protocol, a real install over the running executable,
  # and the reinstalled binary running a real turn. `#[ignore]`d because it
  # executes real binaries and binds real sockets; unlike the `pi` job it needs
  # nothing external — the artifact it serves is the binary this job just built
  # — so it is allowed to fail the build.
  #
  # It needs `ui` for the same reason as `checks`: the one binary carries the
  # app, so this job embeds the bundle too.
  self-update:
    name: worker self-update end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # The app is compiled into these binaries: without the bundle the build
      # fails rather than shipping a server that cannot serve a client.
      - name: Download the app bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: apps/app/dist

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: self-update

      # `CARGO_BIN_EXE_loom` is what the test runs, so the binary has to be
      # built before the ignored test is invoked — `cargo test --test` builds
      # the test target but not necessarily the binary it points at.
      - name: cargo build -p loom
        run: cargo build -p loom --locked

      - name: cargo test -p loom --test self_update
        run: cargo test -p loom --test self_update --locked -- --ignored --test-threads=1
