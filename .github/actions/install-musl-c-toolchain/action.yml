# The C compiler a musl release build needs, installed for the job that wants it.
#
# The store is `rusqlite` with `bundled`, so a build for a musl target compiles
# SQLite's C source for that target, and the `cc` crate has to find a compiler:
# without one the build stops at `failed to find tool "<triple>-gcc"`. This is a
# different tool from the cross *linker* — `--target
# aarch64-unknown-linux-musl` still links with the `rust-lld` that
# `.cargo/config.toml` names.
#
# That is why this is an action rather than a step in one workflow: `release.yml`
# and `ci.yml` both build the musl targets, and the archive each target uses and
# the digest it must match are written down once, here.
name: Install the target's musl C toolchain
description: Install the C cross-compiler a musl build's C dependencies compile with.

inputs:
  target:
    description: The musl target triple the compiler must produce code for.
    required: true

runs:
  using: composite
  steps:
    # musl.cc publishes musl-cross-make's output for these triples. Its
    # `bin/<triple>-gcc` is the name `cc` looks for, so putting that directory on
    # `PATH` is the whole configuration.
    - name: Download, verify and unpack
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        case "$TARGET" in
          x86_64-unknown-linux-musl)
            toolchain=x86_64-linux-musl-cross
            digest=c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea
            ;;
          aarch64-unknown-linux-musl)
            toolchain=aarch64-linux-musl-cross
            digest=c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38
            ;;
          *)
            echo "no musl C toolchain is pinned for $TARGET" >&2
            exit 1
            ;;
        esac
        archive="$RUNNER_TEMP/$toolchain.tgz"
        curl --fail --silent --show-error --location \
          --output "$archive" "https://musl.cc/$toolchain.tgz"
        echo "$digest  $archive" | sha256sum --check --strict
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$toolchain/bin" >>"$GITHUB_PATH"
